<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IUL: Choose Your Path</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 600px at 50% -10%, #1c1812 0%, transparent 55%), #090a0c;
      color: #f6f3ec;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .wrap { width: min(440px, 100%); padding: 32px 20px; text-align: center; }
    h1 {
      margin: 0 0 28px;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      font-size: clamp(2rem, 8vw, 2.6rem); letter-spacing: -0.02em;
    }
    a.btn {
      display: block; margin: 0 0 18px; padding: 26px 20px;
      border-radius: 18px; text-decoration: none;
      font-size: 1.35rem; font-weight: 800; letter-spacing: 0.02em;
      color: #14110a; background: linear-gradient(180deg, #f3ddb0, #e4c27a);
      box-shadow: 0 14px 40px rgba(228,194,122,0.18);
    }
    a.btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Choose your video</h1>
    <a class="btn" href="truckers/">IUL for Truckers</a>
    <a class="btn" href="barbers/">IUL for Barbers</a>
  </div>
</body>
</html>
